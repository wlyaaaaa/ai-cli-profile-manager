name: windows-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pester-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup PowerShell modules
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.5.0
      - name: Smoke tests
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/Test-Release.ps1
      - name: Unit tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
      - name: Build and inspect release archive
        shell: pwsh
        run: |
          ./scripts/Build.ps1
          $zips = @(Get-ChildItem ./dist/ai-cli-profile-manager-*-win-x64.zip)
          if ($zips.Count -ne 1) { throw "Expected one release ZIP, found $($zips.Count)." }
          $zip = $zips[0]
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $entries = @($archive.Entries.FullName -replace '/', '\')
            foreach ($required in @(
              'AI CLI Profile Manager 使用手册.pdf',
              'Codex、Claude Code 与 Open Interpreter CLI 中文手册.pdf',
              'scripts\Install.ps1',
              'scripts\Uninstall.ps1',
              'scripts\Sync-LocalModelProfiles.ps1',
              'scripts\Sync-LocalModelConfiguration.ps1',
              'scripts\Set-CodexDesktopLocalModels.ps1',
              'src\AiCliProfileManager\Support\DesktopBridge\DesktopBridge.csproj',
              'src\AiCliProfileManager\Support\GeminiIntegrationState.json'
            )) {
              if ($entries -notcontains $required) { throw "Archive missing: $required" }
            }
            if ($entries | Where-Object { $_ -eq 'AGENTS.md' -or $_ -like 'docs\product\*' -or $_ -like 'docs\plans\*' }) {
              throw 'Archive contains internal project material.'
            }
            if ($entries | Where-Object { $_ -match '^src\\.*\\(?:bin|obj)\\' }) {
              throw 'Archive contains generated .NET build output.'
            }
          } finally {
            $archive.Dispose()
          }
      - name: Isolated install and uninstall from release archive
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem ./dist/ai-cli-profile-manager-*-win-x64.zip)
          if ($zips.Count -ne 1) { throw "Expected one release ZIP, found $($zips.Count)." }
          $zip = $zips[0]
          $work = Join-Path $env:RUNNER_TEMP ('aicli-package-' + [guid]::NewGuid().ToString('N'))
          $extract = Join-Path $work 'package'
          $modulePath = Join-Path $work 'PowerShell\Modules'
          New-Item -ItemType Directory -Force -Path $extract,$modulePath | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract
          $preview = & (Join-Path $extract 'scripts\Sync-LocalModelProfiles.ps1') -Json | ConvertFrom-Json
          if (-not $preview) { throw 'Packaged local profile preview returned no result.' }
          $desktop = & (Join-Path $extract 'scripts\Set-CodexDesktopLocalModels.ps1') -Mode Status -InstallRoot (Join-Path $work 'desktop') -Json | ConvertFrom-Json
          if (-not $desktop) { throw 'Packaged desktop Status returned no result.' }
          $generatedFixture = Join-Path $extract 'src\AiCliProfileManager\Support\DesktopBridge\obj'
          New-Item -ItemType Directory -Path $generatedFixture -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $generatedFixture 'must-not-install.txt') -Value 'Synthetic build cache'
          $oldModulePath = $env:PSModulePath
          try {
            $env:PSModulePath = "$modulePath;$oldModulePath"
            & (Join-Path $extract 'scripts\Install.ps1') -SourceRoot $extract
            $manifests = @(Get-ChildItem -LiteralPath (Join-Path $modulePath 'AiCliProfileManager') -Recurse -Filter AiCliProfileManager.psd1)
            if ($manifests.Count -ne 1) { throw "Expected one installed manifest, found $($manifests.Count)." }
            $manifest = $manifests[0]
            if (Get-ChildItem -LiteralPath $manifest.DirectoryName -Directory -Recurse | Where-Object Name -In @('bin','obj')) {
              throw 'Installed module contains generated .NET build output.'
            }
            $shimDir = Join-Path $env:LOCALAPPDATA 'aicli\bin'
            if (-not (Test-Path -LiteralPath (Join-Path $shimDir 'aicli.cmd'))) { throw 'Default install did not create aicli.cmd.' }
            $userPath = [string][Environment]::GetEnvironmentVariable('Path', 'User')
            if (@($userPath -split ';' | ForEach-Object { $_.TrimEnd('\','/') }) -notcontains $shimDir.TrimEnd('\','/')) {
              throw 'Default install did not add the shim directory to user PATH.'
            }
            if (-not (Test-Path -LiteralPath $PROFILE.CurrentUserCurrentHost)) { throw 'Default install did not create the PowerShell profile integration.' }
            if ([IO.File]::ReadAllText($PROFILE.CurrentUserCurrentHost) -notmatch '# >>> AI CLI Profile Manager >>>') {
              throw 'Default install did not write the managed PowerShell profile block.'
            }
            Import-Module $manifest.FullName -Force
            if ((Invoke-AiCli -Tokens @('version')) -ne 0) { throw 'Installed package version command failed.' }
            if ((Invoke-AiCli -Tokens @('profile','list','--available','--json') -DataRoot (Join-Path $work 'data')) -ne 0) {
              throw 'Installed package profile list failed.'
            }
            & pwsh -NoLogo -NoProfile -File (Join-Path $extract 'scripts\Uninstall.ps1') -Yes
            if ($LASTEXITCODE -ne 0) { throw "Package uninstall failed with exit code $LASTEXITCODE." }
            if (Test-Path -LiteralPath (Join-Path $modulePath 'AiCliProfileManager')) { throw 'Uninstall left the module directory.' }
            if (Test-Path -LiteralPath (Join-Path $shimDir 'aicli.cmd')) { throw 'Uninstall left the command shim.' }
            $userPathAfter = [string][Environment]::GetEnvironmentVariable('Path', 'User')
            if (@($userPathAfter -split ';' | ForEach-Object { $_.TrimEnd('\','/') }) -contains $shimDir.TrimEnd('\','/')) {
              throw 'Uninstall left the shim directory in user PATH.'
            }
            if ((Test-Path -LiteralPath $PROFILE.CurrentUserCurrentHost) -and
                [IO.File]::ReadAllText($PROFILE.CurrentUserCurrentHost) -match '# >>> AI CLI Profile Manager >>>') {
              throw 'Uninstall left the managed PowerShell profile block.'
            }
          } finally {
            $env:PSModulePath = $oldModulePath
          }

  desktop-child-contract:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Setup Pester
        shell: pwsh
        run: Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.5.0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Offline desktop child contract regressions
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = '1'
          dotnet build ./src/AiCliProfileManager/Support/DesktopBridge/DesktopBridge.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bridge = (Resolve-Path ./src/AiCliProfileManager/Support/DesktopBridge/bin/Release/net10.0/AiCli.CodexDesktopBridge.exe).Path
          python ./tests/DesktopBridge/Invoke-ProtectedChildContractTests.py --bridge $bridge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ./tests/DesktopBridge/Invoke-BackgroundChildTests.py --bridge $bridge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/DesktopBridge/Invoke-TransportTests.ps1 -BridgePath $bridge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  toolkit-consumer-contract:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          path: aicli
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: wlyaaaaa/llm-backend-toolkit
          path: toolkit
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: pwsh
        run: |
          python -m pip install -e ./toolkit
          $env:LLM_TOOLKIT_CONTRACT_AICLI_ROOT = (Resolve-Path ./aicli).Path
          python -m unittest discover -s ./toolkit/tests -p test_aicli_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
